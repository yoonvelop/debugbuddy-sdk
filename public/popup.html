<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DebugBuddy</title>
  <style>
    body {
      width: 400px;
      height: 500px;
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .tabs {
      display: flex;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .tab {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      border-bottom: 2px solid #4285f4;
      color: #4285f4;
    }

    .content {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 8px;
    }

    .log-item {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      background-color: #f9f9f9;
      font-size: 12px;
      font-family: monospace;
    }

    .log-item.error {
      background-color: #ffebee;
    }

    .log-item.warn {
      background-color: #fff8e1;
    }

    .log-item.fetch {
      background-color: #e8f5e9;
    }

    .timestamp {
      color: #888;
      font-size: 10px;
    }

    .error-details {
      margin-top: 8px;
      padding: 8px;
      background-color: #fff;
      border-radius: 4px;
      border: 1px solid #ffcdd2;
      overflow-x: auto;
    }

    .empty-state {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #888;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    button {
      padding: 6px 12px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 8px;
    }

    button:hover {
      background-color: #3367d6;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>DebugBuddy</h2>
    <div>
      <span id="log-count">0</span> 로그 수집됨
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="console">콘솔</div>
    <div class="tab" data-tab="error">에러</div>
    <div class="tab" data-tab="fetch">네트워크</div>
  </div>

  <div class="content" id="log-content">
    <div class="empty-state">로그 데이터가 없습니다.</div>
  </div>

  <div class="actions">
    <button id="clear-logs">로그 지우기</button>
    <button id="copy-logs">로그 복사</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
